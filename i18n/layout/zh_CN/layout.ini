; ---------------------------------------------------------------------------
; 对话框布局偏置（"原版布局 + 偏置"规则）：RC 资源保持官方英文布局；
; 这里的数值控制中文译文额外需要的空间（像素）。
; 参见 oapiZhFitControlText / oapiZhFitControlRow / oapiZhFitDialogButtons。
; ---------------------------------------------------------------------------

[dialog.shuttle_a_anim]
; ShuttleA 动画设置页的整页按钮布局（原版布局 + 偏置）：按钮按中文文字
; 加高后，再整体下移 auxButtonYOffset。参见 oapiZhLayoutDialogButtons。
auxButtonYOffset = 6
; "右"滑块行的下移量：官方两行滑块之间只有 1 个对话框单位，下移右行
; 以便两条滑块都清晰可读；左滑块及其他控件保持不动。
rightSliderYOffset = 6
rightLabelYOffset = 6

[dialog.scneditor.secondary]
; 场景编辑器次级参数页：标签列的固定 x 坐标、数值列最小宽度，
; 以及中文模式放大按钮时使用的额外内边距
labelX = 220
minValWidth = 24
buttonPadX = 16
buttonPadY = 8
; 方向页 "Pitch/Yaw/Bank" 标签的额外内边距
orientationLabelPadX = 8

[dialog.vessel_pages]
; 场景编辑器载具编辑页（DeltaGlider 动画页及今后的载具页）：
; 按钮按中文文字加高后，再整体下移 auxButtonYOffset（原版布局 + 偏置，
; 参见 oapiZhLayoutDialogButtons）。
buttonPadY = 6

[dialog.visual]
; 启动器 Options -> Visual（视觉设置）页的中文布局偏置（原版布局 + 偏置，
; 见 OptionsVisualZh.inc）。中文译文比英文宽：右侧"再入等离子火焰"会压住
; 分组框右边线，"地形自投影"离下方分组框过近。这里把三个分组框加宽、把
; "行星效果"分组框加高，并把其下方内容整体下移。单位为对话框单位（DLU），
; 运行时按 DPI 换算；英文模式不读取/不应用这些偏置。
groupboxExtraWidth = 12
planetaryExtraHeight = 8
lowerBlockYOffset = 9

