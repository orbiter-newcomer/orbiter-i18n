; ---------------------------------------------------------------------------
; Dialog layout offsets ("official layout + offset" rule): the RC resources
; keep the official English layout; these values control how much extra room
; translated Chinese texts get (pixels). See oapiZhFitControlText/Row.
; ---------------------------------------------------------------------------

[dialog.shuttle_a_anim]
; Whole-page button layout for the ShuttleA animation page (official layout +
; offset): buttons are grown vertically to the Chinese text and then moved down
; by buttonYOffset. See oapiZhLayoutDialogButtons.
auxButtonYOffset = 6
; Downward offset of the "Right" slider row (the official gap between the two
; slider rows is only one dialog unit, so the right row is moved down to make
; both sliders readable; the left slider and all other controls stay put)
rightSliderYOffset = 6
rightLabelYOffset = 6

[dialog.scneditor.secondary]
; Secondary-parameter labels: fixed label column x and minimum value width,
; plus button padding used when enlarging small buttons for Chinese text
labelX = 220
minValWidth = 24
buttonPadX = 16
buttonPadY = 8
; Extra padding for the Pitch/Yaw/Bank labels on the orientation page
orientationLabelPadX = 8

[dialog.vessel_pages]
; Vessel editor pages in the scenario editor (DeltaGlider animation pages and
; future vessel pages): buttons are grown vertically to the Chinese text and
; then moved down by buttonYOffset (official layout + offset, see
; oapiZhLayoutDialogButtons)
buttonPadY = 6