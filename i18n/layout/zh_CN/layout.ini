; ============================================================================
; layout.ini - runtime layout data for the Chinese Orbiter UI
;
; Loaded only in Chinese mode; values can be tweaked without rebuilding
; Orbiter. Missing sections/keys fall back to the built-in defaults (which are
; identical to the historical compiled-in values), so deleting this file
; restores the previous behaviour.
;
; Format: [section] headers, key = value, ';' starts a comment.
; ============================================================================

; ---------------------------------------------------------------------------
; MFD layout offsets (see i18n/core/MfdZh.inc). Offsets are expressed in
; character cells (cw = character width, ch = character height); "Half" fields
; are in half cells.
; ---------------------------------------------------------------------------

[mfd.landing]
; Right-top NAV row horizontal offset (in cw; the Chinese "接收机…" is wider
; than the English "NAV…" label)
navRowX = -3
; Extra offset of the magnitude labels ("10^x m") in half cw (positive = left)
cirScaleLblHalfCw = 1

[mfd.docking]
; Right-top NAV row horizontal offset (in cw)
navRowX = -3
; Measured column gap for the Chinese layout (in cw, from the 2nd column on)
colGap = 2
; Extra gap between an arrow and the end of a row (in half cw)
arrowHalfCw = 1

[mfd.sync]
; Column gap of the compact three-column layout (in cw)
colGap = 1
; Right margin of right-aligned tables (in half cw)
rightHalfCw = 1

[mfd.orbit]
; Right-aligned header margin (in cw)
headerRightCw = 1
; Right-aligned target column margin (in half cw)
tgtRightHalfCw = 1

[mfd.map]
; Info row vertical offset (in ch)
infoRowCh = 1
; Additional vertical offset (in half ch)
infoRowHalfCh = 1

[mfd.menu]
; Menu row pitch, base part (in ch)
rowCh = 2
; Menu row pitch, extra part (in ch/4)
rowQuarterCh = 1
; Shortcut row vertical offset, base part (in ch)
keyCh = 1
; Shortcut row vertical offset, extra part (in ch/4)
keyQuarterCh = 1
; Gap between two-row menu items (in half cw)
itemGapHalfCw = 1
; Right margin of the right-aligned menu (in half cw)
rightGapHalfCw = 1

; ---------------------------------------------------------------------------
; Glass cockpit panel: font size specs (see i18n/core/InstrumentZh.inc).
; Font size = clamp(panelHeight * num / den, lo, hi) per spec index.
; ---------------------------------------------------------------------------

[panel.font]
spec0.num = 1
spec0.den = 38
spec0.lo = 18
spec0.hi = 34
spec1.num = 1
spec1.den = 54
spec1.lo = 14
spec1.hi = 26
spec2.num = 1
spec2.den = 49
spec2.lo = 14
spec2.hi = 26
spec3.num = 1
spec3.den = 65
spec3.lo = 13
spec3.hi = 18

