; ============================================================================
; layout.ini —— 中文界面运行时排版数据
;
; 仅在中文模式下加载；修改本文件即可微调排版，无需重新编译 Orbiter。
; 缺少的节/键会使用程序内置默认值（与历史编译期数值完全一致），
; 因此删除本文件即可恢复到之前的显示效果。
;
; 格式：[section] 节标题，key = value 键值对，';' 开头为注释。
; ============================================================================

; ---------------------------------------------------------------------------
; MFD 布局偏置（见 i18n/core/MfdZh.inc）。偏置以字符单元为单位：
; cw = 字符宽、ch = 字符高；"Half" 字段单位为半个字符单元。
; ---------------------------------------------------------------------------

[mfd.landing]
; 右上 NAV 行水平偏移（单位 cw；中文"接收机…"比英文"NAV…"宽）
navRowX = -3
; 数量级标签（"10^x m"）的额外偏移（单位 cw/2，正数向左）
cirScaleLblHalfCw = 1

[mfd.docking]
; 右上 NAV 行水平偏移（单位 cw）
navRowX = -3
; 中文布局实测列间距（单位 cw，从第二列起）
colGap = 2
; 箭头与行尾之间的额外间距（单位 cw/2）
arrowHalfCw = 1

[mfd.sync]
; 三列紧凑排列的列间距（单位 cw）
colGap = 1
; 右对齐表格的右边距（单位 cw/2）
rightHalfCw = 1

[mfd.orbit]
; 表头右对齐边距（单位 cw）
headerRightCw = 1
; 目标列右对齐边距（单位 cw/2）
tgtRightHalfCw = 1

[mfd.map]
; 信息行垂直偏移（单位 ch）
infoRowCh = 1
; 额外垂直偏移（单位 ch/2）
infoRowHalfCh = 1

[mfd.menu]
; 菜单行距基础部分（单位 ch）
rowCh = 2
; 菜单行距额外部分（单位 ch/4）
rowQuarterCh = 1
; 快捷键行垂直偏移基础部分（单位 ch）
keyCh = 1
; 快捷键行垂直偏移额外部分（单位 ch/4）
keyQuarterCh = 1
; 两行菜单项之间的间距（单位 cw/2）
itemGapHalfCw = 1
; 右侧菜单右对齐边距（单位 cw/2）
rightGapHalfCw = 1

; ---------------------------------------------------------------------------
; 玻璃座舱面板：字号档位参数（见 i18n/core/InstrumentZh.inc）。
; 字号 = clamp(面板高度 * num / den, lo, hi)，按档位索引。
; ---------------------------------------------------------------------------

[panel.font]
spec0.num = 1
spec0.den = 38
spec0.lo = 18
spec0.hi = 34
spec1.num = 1
spec1.den = 54
spec1.lo = 14
spec1.hi = 26
spec2.num = 1
spec2.den = 49
spec2.lo = 14
spec2.hi = 26
spec3.num = 1
spec3.den = 65
spec3.lo = 13
spec3.hi = 18

